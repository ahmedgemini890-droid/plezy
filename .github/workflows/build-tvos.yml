name: Build Official Plezy tvOS IPA

on:
  workflow_dispatch:

jobs:
  build-tvos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.1"
          cache: true

      - name: Fetch tvOS custom engine
        run: |
          chmod +x tvos/scripts/fetch_engine.sh
          ./tvos/scripts/fetch_engine.sh

      - name: Install dependencies and Pods
        run: |
          flutter pub get
          cd tvos
          chmod +x scripts/pod_install.sh
          ./scripts/pod_install.sh

      - name: Fix tvOS StoreKit2 winBackOffers
        run: |
          python3 -c "
          import re, os

          p1 = 'tvos/Runner/Plugins/in_app_purchase_storekit/InAppPurchasePlugin+StoreKit2.swift'
          if os.path.exists(p1):
              with open(p1, 'r') as f:
                  c = f.read()
              c = c.replace(
                  'if #available(iOS 18.0, macOS 15.0, *) {\n          if let winBackOfferId = options?.winBackOfferId,\n            let winBackOffer = product.subscription?.winBackOffers.first(where: {\n              $0.id == winBackOfferId\n            })\n          {\n            purchaseOptions.insert(.winBackOffer(winBackOffer))\n          }\n        }',
                  '#if !os(tvOS)\n        if #available(iOS 18.0, macOS 15.0, *) {\n          if let winBackOfferId = options?.winBackOfferId,\n            let winBackOffer = product.subscription?.winBackOffers.first(where: {\n              $0.id == winBackOfferId\n            })\n          {\n            purchaseOptions.insert(.winBackOffer(winBackOffer))\n          }\n        }\n#endif'
              )
              pattern = r'let isEligible = try await subscription\.status\.contains.*?completion\(\.success\(isEligible\)\)'
              c = re.sub(
                  pattern,
                  '#if !os(tvOS)\n          let isEligible = try await subscription.status.contains { status in if case .verified(let renewalInfo) = status.renewalInfo { return renewalInfo.eligibleWinBackOfferIDs.contains(offerId) }\n return false }\n completion(.success(isEligible))\n#else\n          completion(.success(false))\n#endif',
                  c,
                  flags=re.DOTALL
              )
              with open(p1, 'w') as f:
                  f.write(c)

          p2 = 'tvos/Runner/Plugins/in_app_purchase_storekit/StoreKit2Translators.swift'
          if os.path.exists(p2):
              with open(p2, 'r') as f:
                  c2 = f.read()
              c2 = c2.replace(
                  'if #available(iOS 18.0, macOS 15.0, *) {\n      allOffers.append(contentsOf: winBackOffers.map { $0.convertToPigeon })\n    }',
                  '#if !os(tvOS)\n    if #available(iOS 18.0, macOS 15.0, *) {\n      allOffers.append(contentsOf: winBackOffers.map { $0.convertToPigeon })\n    }\n#endif'
              )
              c2 = c2.replace(
                  'if #available(iOS 18.0, macOS 15.0, *) {\n        if self == .winBack {\n          return SK2SubscriptionOfferTypeMessage.winBack\n        }\n      }',
                  '#if !os(tvOS)\n      if #available(iOS 18.0, macOS 15.0, *) {\n        if self == .winBack {\n          return SK2SubscriptionOfferTypeMessage.winBack\n        }\n      }\n#endif'
              )
              with open(p2, 'w') as f:
                  f.write(c2)
          print('StoreKit2 tvOS patch verified and applied successfully!')
          "

      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -r Plezy-tvOS.ipa Payload

      - name: Upload tvOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Plezy-tvOS
          path: Plezy-tvOS.ipa
