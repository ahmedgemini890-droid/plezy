name: Build Official Plezy tvOS IPA

on:
  workflow_dispatch:

jobs:
  build-tvos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.47.1"
          cache: true

      - name: Fetch tvOS custom engine
        run: |
          chmod +x tvos/scripts/fetch_engine.sh
          ./tvos/scripts/fetch_engine.sh

      - name: Install dependencies and Pods
        run: |
          flutter pub get
          cd tvos
          chmod +x scripts/pod_install.sh
          ./scripts/pod_install.sh

      - name: Fix tvOS StoreKit2 winBackOffers
        run: |
          python3 -c "
          import re

          p1 = 'tvos/Runner/Plugins/in_app_purchase_storekit/InAppPurchasePlugin+StoreKit2.swift'
          with open(p1, 'r') as f:
              c1 = f.read()
          c1 = re.sub(r'if #available\([^)]*\)\s*\{\s*if let winBackOfferId = options\?\.winBackOfferId.*?purchaseOptions\.insert\(\.winBackOffer\(winBackOffer\)\)\s*\}\s*\}', '#if !os(tvOS)\n        /* winback */\n#endif', c1, flags=re.DOTALL)
          c1 = re.sub(r'let isEligible = try await subscription\.status\.contains.*?completion\(\.success\(isEligible\)\)', '#if !os(tvOS)\n          let isEligible = try await subscription.status.contains { status in if case .verified(let renewalInfo) = status.renewalInfo { return renewalInfo.eligibleWinBackOfferIDs.contains(offerId) }\n return false }\n completion(.success(isEligible))\n#else\n          completion(.success(false))\n#endif', c1, flags=re.DOTALL)
          c1 = re.sub(r'if let compactJWS = options\?\.introductoryOfferEligibilityCompactJWS\s*\{\s*purchaseOptions\.insert\(\.introductoryOfferEligibility\(compactJWS: compactJWS\)\)\s*\}', '#if !os(tvOS)\n        /* introductoryOfferEligibility */\n#endif', c1, flags=re.DOTALL)
          with open(p1, 'w') as f:
              f.write(c1)

          p2 = 'tvos/Runner/Plugins/in_app_purchase_storekit/StoreKit2Translators.swift'
          with open(p2, 'r') as f:
              c2 = f.read()
          c2 = re.sub(r'if #available\([^)]*\)\s*\{\s*allOffers\.append\(contentsOf:\s*winBackOffers.*?\n\s*\}', '#if !os(tvOS)\n    /* winback */\n#endif', c2, flags=re.DOTALL)
          c2 = re.sub(r'if #available\([^)]*\)\s*\{\s*if self == \.winBack\s*\{.*?\n\s*\}\s*\}', '#if !os(tvOS)\n        /* winback */\n#endif', c2, flags=re.DOTALL)
          with open(p2, 'w') as f:
              f.write(c2)

          print('StoreKit2 tvOS patches applied cleanly!')
          assert c1.count('winBack') == 0 and c2.count('winBack') == 0, 'winBack remains'
          assert 'introductoryOfferEligibility(compactJWS' not in c1, 'introductoryOfferEligibility remains'
          "

      - name: Build tvOS Archive
        run: |
          xcodebuild archive \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r build/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -r Plezy-tvOS.ipa Payload

      - name: Upload tvOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: Plezy-tvOS
          path: Plezy-tvOS.ipa
